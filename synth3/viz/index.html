<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>synth3 Explorer 可视化</title>
<style>
  :root {
    --bg:#0f1115; --card:#171a21; --card2:#1d2128; --line:#2a2f3a;
    --fg:#e6e6e6; --muted:#888;
    --act:#4ea1ff; --rec:#ffb454; --done:#c08adb; --err:#ff7b7b;
    --ok:#4cd07d;
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:13px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;}
  .app{display:grid;grid-template-columns:240px 1fr 520px;height:100vh;}
  .col{overflow:auto;border-right:1px solid var(--line);}
  .col:last-child{border-right:none;}
  header{padding:14px 18px;border-bottom:1px solid var(--line);
    background:var(--bg);position:sticky;top:0;z-index:5;}
  h1{margin:0 0 4px;font-size:15px;}
  .sub{color:var(--muted);font-size:11px;}

  /* sidebar */
  .tasklist .item{padding:10px 14px;border-bottom:1px solid var(--line);
    cursor:pointer;font-size:12.5px;}
  .tasklist .item:hover{background:var(--card);}
  .tasklist .item.on{background:#1f2a3a;}
  .tasklist .name{font-weight:600;color:#ddd;}
  .tasklist .meta{color:var(--muted);font-size:11px;margin-top:2px;}
  .pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;
    margin-right:4px;vertical-align:middle;}
  .pill.cand{background:#16432a;color:#9ff0bf;}
  .pill.nocand{background:#3a1616;color:#ff9999;}
  .pill.cat{background:#2a1f3a;color:#c08adb;}

  /* center timeline */
  main{padding:0;}
  .hd{padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;
    top:0;background:var(--bg);}
  .qhead{font-size:13px;color:#bcd;margin:0;}
  .meta-line{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .legend{font-size:11px;color:var(--muted);margin-top:6px;}
  .legend .k{padding:1px 6px;border-radius:3px;margin-right:6px;}
  .legend .k.act{background:#163a5e;color:#9fd1ff;}
  .legend .k.rec{background:#3a2a14;color:#ffd479;}
  .legend .k.done{background:#2a1f3a;color:#c08adb;}

  .timeline{padding:14px 18px 80px;}
  .step{background:var(--card);border:1px solid var(--line);border-radius:7px;
    padding:10px 12px;margin:6px 0;cursor:pointer;}
  .step:hover{background:var(--card2);}
  .step.on{outline:1.5px solid #6794d1;}
  .step.mode-ACT{border-left:3px solid var(--act);}
  .step.mode-RECORD{border-left:3px solid var(--rec);}
  .step.mode-RECORD_OR_DONE{border-left:3px solid var(--rec);}
  .step.violation{border-left-color:var(--err);}
  .step .hd{padding:0;border:none;background:transparent;position:static;}
  .step .top{display:flex;gap:8px;align-items:center;}
  .step .num{color:var(--muted);font-size:11px;font-family:monospace;}
  .badge{font-size:10px;padding:1px 6px;border-radius:3px;font-family:monospace;}
  .badge.mode-ACT{background:#163a5e;color:#9fd1ff;}
  .badge.mode-RECORD{background:#3a2a14;color:var(--rec);}
  .badge.mode-RECORD_OR_DONE{background:#3a2a14;color:var(--rec);}
  .badge.k-act{background:#1a3525;color:#9ff0bf;}
  .badge.k-record_task{background:#3a2a14;color:var(--rec);}
  .badge.k-done{background:#2a1f3a;color:var(--done);}
  .badge.k-null{background:#3a1616;color:var(--err);}
  .step .title{font-size:12.5px;color:#ddd;font-weight:600;}
  .step .summary{font-size:11.5px;color:#bbb;margin-top:4px;}
  .step .obs{font-size:11px;color:var(--muted);margin-top:3px;}
  .step .obs.ok{color:#9ff0bf;}
  .step .obs.fail{color:var(--err);}

  /* right detail */
  aside{padding:0;background:var(--bg);}
  .dhd{padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;
    top:0;background:var(--bg);font-size:12px;color:#ddd;}
  .dbody{padding:14px 16px;}
  .sec{margin-bottom:14px;}
  .sec .t{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:5px;}
  .sec pre{background:var(--card);border:1px solid var(--line);border-radius:5px;
    padding:8px 10px;margin:0;font-size:11px;white-space:pre-wrap;word-break:break-word;
    max-height:280px;overflow:auto;}
  .sec code{background:var(--card);padding:1px 5px;border-radius:3px;}
  .sec img{max-width:100%;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;}
  .kv{font-size:12px;color:#ccc;}
  .kv b{color:#9fd1ff;}

  /* candidates summary at top of right pane when no step selected */
  .candcard{background:#1a2510;border:1px solid #2a3a18;border-radius:6px;
    padding:10px 12px;margin-bottom:10px;}
  .candcard b{color:#9ff0bf;}
  .candcard .ck{font-size:11px;color:#aaa;margin-top:5px;}

  .empty{color:var(--muted);font-size:12px;padding:30px;text-align:center;}
</style>
</head>
<body>
<div class="app">

  <!-- LEFT: site list -->
  <aside class="col sidebar">
    <header>
      <h1>🔭 synth3 explorer</h1>
      <div class="sub" id="rundir"></div>
    </header>
    <div class="tasklist" id="tasklist"></div>
  </aside>

  <!-- CENTER: timeline -->
  <main class="col">
    <div class="hd">
      <p class="qhead" id="qhead">从左侧选择一个站点</p>
      <p class="meta-line" id="metaline"></p>
      <div class="legend">
        <span class="k act">ACT</span><span class="k rec">RECORD</span>
        <span class="k done">DONE</span>
        <span style="color:#666">·</span>
        <span style="color:#999">router 决定 mode → LLM 必须服从</span>
      </div>
    </div>
    <div class="timeline" id="timeline"><div class="empty">无数据</div></div>
  </main>

  <!-- RIGHT: detail / candidates -->
  <aside class="col">
    <div class="dhd" id="dhd">详情</div>
    <div class="dbody" id="dbody"><div class="empty">点击中间任意一步查看详情</div></div>
  </aside>

</div>

<script>
const state = { manifest:null, current:null, task:null, selected:null };
const $ = s => document.querySelector(s);
const esc = s => (s+'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function init(){
  state.manifest = await fetch('manifest.json').then(r=>r.json());
  $('#rundir').textContent = `${state.manifest.tasks.length} 个站点`;
  renderList();
  if (state.manifest.tasks.length) loadTask(state.manifest.tasks[0].domain);
}

function renderList(){
  $('#tasklist').innerHTML = state.manifest.tasks.map(t=>`
    <div class="item ${state.current===t.domain?'on':''}" onclick="loadTask('${esc(t.domain)}')">
      <div class="name">${esc(t.domain)}</div>
      <div class="meta">
        <span class="pill cat">${esc(t.category||'?')}</span>
        ${t.n_candidates>0 ? `<span class="pill cand">★ ${t.n_candidates}</span>` : '<span class="pill nocand">0</span>'}
        <span style="color:#666">${t.n_steps} 步</span>
      </div>
    </div>
  `).join('');
}

async function loadTask(domain){
  state.current = domain;
  state.task = await fetch(`data/${encodeURIComponent(domain)}.json`).then(r=>r.json());
  state.selected = null;
  renderList();
  renderHead();
  renderTimeline();
  renderCandidates();
}

function renderHead(){
  const t = state.task;
  $('#qhead').textContent = `${t.domain}  ·  ${t.site.entry_url||''}`;
  $('#metaline').innerHTML = `
    步数: <b>${t.steps_used}/${t.n_steps}</b>
    · 录得任务: <b style="color:${t.n_candidates>0?'#9ff0bf':'#ff9999'}">${t.n_candidates}</b>
    · 探针 switch_kind 提示: ${esc(t.site.switch_kind||'?')}
    · img? ${t.site.image_required?'yes':'no'}
  `;
}

function renderTimeline(){
  if (!state.task.steps.length) {
    $('#timeline').innerHTML = '<div class="empty">无步骤</div>';
    return;
  }
  $('#timeline').innerHTML = state.task.steps.map((s,i) => stepCard(s,i)).join('');
}

function stepCard(s, i){
  const violation = s.parsed_kind && !isKindAllowed(s.mode, s.parsed_kind);
  let title = '', summary = '';
  if (s.parsed_kind === 'act') {
    const tc = (s.parsed.tool_call||{});
    title = `🔧 ${esc(tc.name||'?')} `;
    summary = esc((tc.action_description || (tc.arguments && tc.arguments.action_description) || (s.parsed.thought||'')).slice(0,200));
  } else if (s.parsed_kind === 'record_task') {
    const task = s.parsed.task || {};
    title = `📝 record_task (${esc(task.switch_kind||'?')})`;
    summary = esc((task.question||'').slice(0,200));
  } else if (s.parsed_kind === 'done') {
    title = `✅ done`;
    summary = esc((s.parsed.summary||'').slice(0,200));
  } else if (s.error) {
    title = `❌ error`;
    summary = esc(s.error.slice(0,200));
  } else {
    title = `⚠️ unparsed`;
    summary = `LLM 未输出可解析 JSON (raw_len=${s.raw_response.length})`;
  }
  const obs = s.observation || {};
  const obsClass = obs.status==='success' ? 'ok' : (obs.status==='failure' || obs.status==='router_violation' ? 'fail' : '');
  const obsText = obs.status ?
    `obs: ${obs.status}${obs.ended_url ? ` · ${obs.ended_url.slice(0,60)}` : ''}${obs.error ? ` · ${obs.error.slice(0,60)}` : ''}` :
    '';
  const sel = state.selected===i ? 'on':'';
  return `
    <div class="step mode-${esc(s.mode)} ${violation?'violation':''} ${sel}"
         onclick="selectStep(${i})">
      <div class="top">
        <span class="num">#${s.step}</span>
        <span class="badge mode-${esc(s.mode)}">${esc(s.mode)}</span>
        <span class="badge k-${esc(s.parsed_kind||'null')}">→ ${esc(s.parsed_kind||'null')}</span>
        ${violation ? '<span class="badge k-null">违反契约</span>':''}
      </div>
      <div class="title" style="margin-top:5px">${title}</div>
      <div class="summary">${summary}</div>
      ${obsText ? `<div class="obs ${obsClass}">${esc(obsText)}</div>`:''}
    </div>
  `;
}

function isKindAllowed(mode, kind){
  if (mode==='ACT') return kind==='act';
  if (mode==='RECORD') return kind==='record_task';
  if (mode==='RECORD_OR_DONE') return kind==='record_task'||kind==='done';
  return true;
}

function selectStep(i){
  state.selected = i;
  renderTimeline();
  renderDetail();
}

function renderDetail(){
  const s = state.task.steps[state.selected];
  if (!s) return;
  $('#dhd').textContent = `Step #${s.step}  ·  mode=${s.mode}  ·  kind=${s.parsed_kind||'null'}`;
  const shot = s.screenshot ? `<div class="sec"><div class="t">截图</div><img src="${esc(s.screenshot)}" onclick="window.open('${esc(s.screenshot)}')"></div>`:'';
  const obs = s.observation || {};
  const parsedPretty = JSON.stringify(s.parsed, null, 2);
  $('#dbody').innerHTML = `
    ${shot}
    <div class="sec">
      <div class="t">router 指令(输入 → LLM)</div>
      <pre>ROUTER MODE = ${s.mode}\n${describeMode(s.mode)}</pre>
    </div>
    <div class="sec">
      <div class="t">LLM 原始输出</div>
      <pre>${esc(s.raw_response)}</pre>
    </div>
    <div class="sec">
      <div class="t">解析后 JSON</div>
      <pre>${esc(parsedPretty||'(未解析)')}</pre>
    </div>
    ${obs.status ? `
      <div class="sec">
        <div class="t">observation(执行结果)</div>
        <pre>${esc(JSON.stringify(obs, null, 2))}</pre>
      </div>` : ''}
    ${s.error ? `
      <div class="sec">
        <div class="t">错误</div>
        <pre>${esc(s.error)}</pre>
      </div>`:''}
  `;
}

function describeMode(m){
  if (m==='ACT') return 'LLM 必须输出 {"kind":"act",...},executor 调浏览器工具';
  if (m==='RECORD') return 'LLM 必须输出 {"kind":"record_task",...},强制提交任务';
  if (m==='RECORD_OR_DONE') return 'LLM 输出 record_task 或 done,act 禁止';
  return m;
}

function renderCandidates(){
  if (state.selected!==null) return;
  const t = state.task;
  if (!t.candidates || !t.candidates.length) {
    $('#dbody').innerHTML = '<div class="empty">这站没录得任何 candidate</div>';
    return;
  }
  const cards = t.candidates.map((c,i)=>`
    <div class="candcard">
      <b>★ candidate ${i+1}</b>
      <div style="margin-top:5px">${esc(c.question||'')}</div>
      <div class="ck">
        start_mode=<b>${esc(c.start_mode||'?')}</b> ·
        switch_kind=<b>${esc(c.switch_kind||'?')}</b> ·
        image_required=<b>${c.image_required?'yes':'no'}</b>
      </div>
      <div class="ck"><i>evidence:</i> ${esc(c.evidence||'')}</div>
    </div>
  `).join('');
  $('#dbody').innerHTML = `<div class="sec"><div class="t">录得的任务</div>${cards}</div>`;
}

init();
</script>
</body>
</html>
