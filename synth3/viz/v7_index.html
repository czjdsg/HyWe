<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>synth7 Viz</title>
<style>
:root {
  --bg:#0e1116; --card:#171a21; --card2:#1d2128; --line:#2a2f3a;
  --fg:#e6e6e6; --muted:#888;
  --O:#ea580c; --O-soft:#3a2515;
  --S:#2563eb; --S-soft:#152540;
  --SH:#06b6d4; --SH-soft:#0e3a44;
  --easy:#16a34a; --medium:#eab308; --hard:#dc2626;
  --ok:#9ff0bf; --warn:#ffd479; --err:#ff7b7b;
}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
.app{display:grid;grid-template-columns:300px 1fr 560px;height:100vh;}
.col{overflow:auto;border-right:1px solid var(--line);}
.col:last-child{border-right:none;}
header{padding:12px 14px;border-bottom:1px solid var(--line);
  background:var(--bg);position:sticky;top:0;z-index:5;}
h1{margin:0;font-size:14px;color:#cde;}
.sub{color:var(--muted);font-size:11px;margin-top:2px;}
input[type=search]{width:100%;padding:6px 8px;background:var(--card);
  border:1px solid var(--line);color:var(--fg);border-radius:5px;font-size:12px;
  margin-top:6px;}

.tasklist .item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;}
.tasklist .item:hover{background:var(--card);}
.tasklist .item.on{background:#1f2a3a;}
.tasklist .id{font-weight:600;color:#ddd;font-size:12px;}
.tasklist .meta{color:var(--muted);font-size:10.5px;margin-top:4px;font-family:monospace;}
.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;
  margin-right:4px;font-family:monospace;}
.pill.O{background:var(--O-soft);color:#ffb084;}
.pill.S{background:var(--S-soft);color:#9fd1ff;}
.pill.SH{background:var(--SH-soft);color:#7be1ee;}
.pill.task{background:#16432a;color:#9ff0bf;}
.pill.notask{background:#3a1616;color:#ff9999;}
.pill.easy{background:#0d3a1f;color:var(--easy);}
.pill.medium{background:#3a2a0d;color:var(--medium);}
.pill.hard{background:#3a0d0d;color:var(--hard);}

main{padding:0;}
.section{border-bottom:1px solid var(--line);padding:14px 16px;}
.section h2{font-size:13px;color:#bcd;margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px;}

.task{background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:10px 12px;margin:8px 0;}
.task .q{color:#ddd;font-size:13px;line-height:1.5;}
.task .tmeta{margin-top:6px;color:var(--muted);font-size:11px;}
.task .ph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.task .ph .seg{padding:3px 8px;border-radius:4px;font-size:11px;font-family:monospace;}
.task .ph .seg.O{background:var(--O-soft);color:#ffb084;}
.task .ph .seg.S{background:var(--S-soft);color:#9fd1ff;}
.task .ph .seg.sw{background:#3a0d3a;color:#f0a6f0;border:1px dashed #b75ab7;}
.swrow{margin-top:6px;padding:5px 8px;background:#2a0d2a;border-left:3px solid #b75ab7;
  border-radius:4px;font-size:11px;color:#f0a6f0;font-family:monospace;}
.task .chain{margin-top:8px;color:var(--muted);font-size:11px;}
.task .chain code{background:var(--card2);padding:1px 4px;border-radius:3px;font-size:11px;}

.facts table{width:100%;border-collapse:collapse;font-size:11.5px;}
.facts th,.facts td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
.facts th{color:var(--muted);font-weight:normal;font-size:10.5px;text-transform:uppercase;
  position:sticky;top:0;background:var(--bg);}
.facts tr.used{background:#162a35;}
.facts tr.harv{background:#0a1f24;}
.facts .key{font-family:monospace;color:#cde;font-size:11px;}
.facts .val{color:#aaa;}
.facts .reason{color:var(--muted);font-size:10.5px;font-style:italic;margin-top:2px;}
.facts .qa{font-size:10.5px;color:#8aa;margin-top:3px;line-height:1.4;}
.facts .qa b{color:#bcd;}
.facts .anchor{color:#7be1ee;font-size:10.5px;}
.facts details{margin-top:6px;}
.facts details summary{color:#9bb;font-size:10.5px;cursor:pointer;list-style:none;
  padding:3px 6px;background:#0e1820;border:1px solid var(--line);border-radius:3px;
  display:inline-block;user-select:none;}
.facts details summary:hover{background:#162232;}
.facts details summary::before{content:"▸ ";color:#666;}
.facts details[open] summary::before{content:"▾ ";color:#9fd1ff;}
.facts .trace{margin-top:6px;background:#0a0e14;border:1px solid var(--line);
  border-radius:4px;padding:6px 8px;font-family:monospace;font-size:10.5px;line-height:1.5;}
.facts .trace .tstep{padding:5px 0;border-bottom:1px dashed #222;}
.facts .trace .tstep:last-child{border-bottom:none;}
.facts .trace .tstep .tnum{color:#666;}
.facts .trace .tstep .taction{font-weight:bold;}
.facts .trace .taction.search{color:#9fd1ff;}
.facts .trace .taction.scholar{color:#c4b5fd;}
.facts .trace .taction.visit{color:#fbbf24;}
.facts .trace .targs{color:#aaa;margin-left:14px;margin-top:2px;}
.facts .trace .tresult{color:#666;margin-left:14px;margin-top:2px;
  white-space:pre-wrap;word-break:break-word;}
.facts .trace .tresult b{color:#9bb;}
.facts .trace .tdesc{color:#9ed99e;margin-left:14px;margin-top:3px;font-size:11px;}
.facts .trace .tdesc b{color:#7a7;}
.facts .trace .trat{color:#bbb;margin-left:14px;margin-top:2px;font-size:11px;font-style:italic;}
.facts .trace .trat b{color:#788;font-style:normal;}
.facts .trace .tcum{color:#d4b86a;margin-left:14px;margin-top:3px;font-size:11px;
  white-space:pre-wrap;word-break:break-word;}
.facts .trace .tcum b{color:#a8853a;}
.facts .trace .turl{color:#789;margin-left:14px;margin-top:2px;font-size:10.5px;}
.facts .trace .turl code{color:#9bf;}
.facts .harvtable{margin-top:6px;font-size:10.5px;color:#aaa;}
.facts .harvtable .hh{color:var(--SH);font-family:monospace;}

.timeline .step{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:7px 10px;margin:5px 0;cursor:pointer;display:flex;gap:8px;align-items:center;}
.timeline .step:hover{background:var(--card2);}
.timeline .step.on{outline:1.5px solid #6794d1;}
.timeline .step.has-fact{border-left:3px solid var(--ok);}
.timeline .step.extractor{background:#1a2418;border-left:3px solid #4a8;margin-left:18px;}
.timeline .step.extractor .num{color:#4a8;}
.timeline .step.extractor .desc{color:#9d9;}
.timeline .pill.E{background:#173;color:#aef;font-weight:bold;}
.timeline .pill.O{background:#137;color:#bcf;}
.timeline .nupd{font-size:10.5px;color:#d4b86a;font-family:monospace;margin-left:4px;}
.timeline .npur{font-size:10.5px;color:#c9c;font-family:monospace;margin-left:4px;}
.timeline .num{color:var(--muted);font-size:11px;font-family:monospace;min-width:24px;}
.timeline .desc{flex:1;font-size:12px;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.timeline .nfact{font-size:10.5px;color:var(--ok);font-family:monospace;}

aside{padding:0;background:var(--bg);}
.dhd{padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--bg);font-size:12px;color:#ddd;}
.dbody{padding:12px 14px;}
.sec{margin-bottom:14px;}
.sec .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.sec pre{background:var(--card);border:1px solid var(--line);border-radius:5px;
  padding:8px 10px;margin:0;font-size:11px;white-space:pre-wrap;word-break:break-word;
  max-height:320px;overflow:auto;}
.sec img{max-width:100%;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;}
.empty{color:var(--muted);font-size:12px;padding:30px;text-align:center;}
.loading{color:var(--muted);font-size:12px;padding:20px;text-align:center;}
</style>
</head>
<body>
<div class="app">
  <div class="col">
    <header>
      <h1>synth7 viz</h1>
      <div class="sub" id="cnt">loading…</div>
      <input type="search" id="q" placeholder="search domain…">
    </header>
    <div class="tasklist" id="list"></div>
  </div>
  <main class="col" id="main">
    <div class="empty">← pick a site</div>
  </main>
  <aside class="col">
    <div class="dhd" id="detailHead">step detail</div>
    <div class="dbody" id="detail"><div class="empty">click a step</div></div>
  </aside>
</div>
<script>
const ST = { manifest:[], cur:null, data:null, q:"", stepIdx:-1, usedKeys:new Set() };

async function loadManifest() {
  const r = await fetch("manifest.json");
  const m = await r.json();
  ST.manifest = m.tasks || [];
  document.getElementById("cnt").textContent = `${ST.manifest.length} sites`;
  renderList();
}
function renderList() {
  const q = ST.q.toLowerCase();
  const filtered = q ? ST.manifest.filter(t => (t.domain||"").toLowerCase().includes(q)) : ST.manifest;
  const ul = document.getElementById("list");
  ul.innerHTML = filtered.map(t => `
    <div class="item ${ST.cur===t.domain?'on':''}" data-id="${esc(t.domain)}">
      <div class="id">${esc(t.domain)}</div>
      <div class="meta">
        steps=${t.n_steps} · facts=${t.n_facts}
        <span class="pill O">O:${t.n_tagged_O}</span><span class="pill S">S:${t.n_tagged_S}</span><span class="pill SH">H:${t.n_harv}</span>
        ${t.stage_c_kind==='task_set' ? `<span class="pill task">${t.n_tasks} tasks</span>` : `<span class="pill notask">${t.stage_c_kind}</span>`}
        ${(t.difficulties||[]).map(d=>`<span class="pill ${d||''}">${(d||'?')[0].toUpperCase()}</span>`).join('')}
      </div>
    </div>`).join("");
  ul.querySelectorAll(".item").forEach(el => el.onclick = () => selectSite(el.dataset.id));
}
async function selectSite(dom) {
  ST.cur = dom; ST.stepIdx = -1; ST.data = null; ST.usedKeys = new Set();
  renderList();
  document.getElementById("main").innerHTML = `<div class="loading">loading ${esc(dom)}…</div>`;
  document.getElementById("detailHead").textContent = "step detail";
  document.getElementById("detail").innerHTML = `<div class="empty">click a step</div>`;
  try {
    const r = await fetch(`data/${encodeURIComponent(dom)}.json`);
    ST.data = await r.json();
    // collect all fact_keys used by any task
    const ts = (ST.data.task_set||{}).tasks || [];
    for (const t of ts) {
      for (const c of (t.chain||[])) if (c.fact_key) ST.usedKeys.add(c.fact_key);
      for (const p of (t.phases||[])) for (const k of (p.fact_keys||[])) ST.usedKeys.add(k);
    }
    renderMain();
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="empty">load fail: ${esc(String(e))}</div>`;
  }
}
function renderMain() {
  const d = ST.data;
  const ts = d.task_set || {};
  const tasks = ts.tasks || [];
  const cnts = d.stage_b_counts || {};
  const html = [];
  // header summary
  html.push(`<div class="section">
    <h2>${esc(d.domain)}</h2>
    <div class="sub">${esc((d.site||{}).entry_url||'')} · category: ${esc((d.site||{}).category||'?')}</div>
    <div class="sub" style="margin-top:6px">
      Stage A: ${d.n_steps} steps · ${d.facts.length} fact rows ·
      <span class="pill O">O:${cnts.o_exclusive||0}</span>
      <span class="pill S">S:${cnts.s_reachable||0}</span>
      <span class="pill SH">harv:${cnts.harvested||0}</span>
      probed: ${cnts.probed||0} · skipped: ${cnts.skipped||0}
    </div>
  </div>`);
  // task_set
  if (ts.kind === 'task_set' && tasks.length) {
    html.push(`<div class="section"><h2>Generated tasks (${tasks.length})</h2>`);
    for (const [i,t] of tasks.entries()) {
      // Prefer the typed route_plan (explicit switch entries); fall back to
      // bare working phases for old bundles.
      const typed = t.route_plan_typed && t.route_plan_typed.length
        ? t.route_plan_typed
        : (t.phases||[]).map(p=>({type:'task', ...p}));
      const phaseSegs = typed.map(p =>
        p.type === 'switch'
          ? `<span class="seg sw">⇄ ${p.to}</span>`
          : `<span class="seg ${p.mode}">${p.mode}</span>`
      ).join(' ');
      let phaseIdx = 0;
      const phaseDetail = typed.map(p => {
        if (p.type === 'switch') {
          return `<div class="swrow">⇄ SWITCH → ${esc(p.to||'?')} · ${esc(p.reason||'')}</div>`;
        }
        phaseIdx += 1;
        return `
        <div style="margin-top:6px;padding:6px 8px;background:var(--card2);border-radius:4px;font-size:11px;">
          <span class="pill ${p.mode}">phase ${phaseIdx} · ${p.mode}</span>
          <span style="color:#ccc">${esc(p.subgoal||'')}</span>
          <div style="color:var(--muted);margin-top:3px"><b>done_when:</b> ${esc(p.done_when||'')}</div>
          ${(p.fact_keys||[]).length ? `<div style="color:var(--muted);margin-top:3px"><b>fact_keys:</b> ${(p.fact_keys||[]).map(k=>`<code>${esc(k)}</code>`).join(' ')}</div>`:''}
        </div>`;
      }).join('');
      const chainLine = (t.chain||[]).map(c=>`<code>${esc(c.fact_key||'')}</code><span style="color:#666"> (${esc(c.role||'')})</span>`).join(' → ');
      const sig_score = (t.score !== undefined && t.score !== null) ? ` · score=${t.score}` : '';
      html.push(`<div class="task">
        <div class="q">[${i+1}] ${esc(t.question||'')}</div>
        <div class="tmeta">
          <span class="pill ${t.difficulty||''}">${esc(t.difficulty||'?')}</span>
          ${t.shape ? `<span class="pill task">${esc(t.shape)}</span>` : ''}
          start=${esc(t.start_mode||'?')} · ${t.n_phases||0} phases · ${t.n_crossings||0}× switch${sig_score}
        </div>
        <div class="ph">${phaseSegs}</div>
        ${phaseDetail}
        <div class="chain"><b>chain:</b> ${chainLine}</div>
        ${t.answer_sketch ? `<div class="chain" style="color:#9bb"><b>answer sketch:</b> ${esc(t.answer_sketch)}</div>`:''}
      </div>`);
    }
    html.push(`</div>`);
  } else {
    html.push(`<div class="section"><h2>Generated tasks</h2>
      <div style="color:var(--muted);font-size:12px">
        kind = <b style="color:var(--err)">${esc(ts.kind||'no_task')}</b>
        ${ts.reason ? `<div style="margin-top:6px">reason: ${esc(ts.reason)}</div>`:''}
      </div></div>`);
  }
  // facts table
  html.push(`<div class="section facts"><h2>Fact table</h2>
    <table>
    <thead><tr>
      <th style="width:30%">key</th><th style="width:18%">tag</th>
      <th>value</th><th style="width:55px">step</th><th style="width:60px">used?</th>
    </tr></thead>
    <tbody>
    ${d.facts.map(f => renderFactRow(f)).join('')}
    </tbody></table>
  </div>`);
  // timeline
  html.push(`<div class="section timeline"><h2>Stage A — exploration timeline</h2>
    ${d.steps.map((s,i)=>renderStepRow(s,i)).join('')}
  </div>`);
  document.getElementById("main").innerHTML = html.join('');
  document.querySelectorAll(".timeline .step").forEach(el => el.onclick = () => selectStep(parseInt(el.dataset.i)));
}
function renderFactRow(f) {
  const isUsed = ST.usedKeys.has(f.key);
  const cls = f.row_kind === 'harvested' ? 'harv' : (isUsed ? 'used' : '');
  let tagPill = '';
  if (f.tag === 'O_EXCLUSIVE') tagPill = `<span class="pill O">O_EXCL</span>`;
  else if (f.tag === 'S_REACHABLE') tagPill = `<span class="pill S">S_REACH</span>`;
  else if (f.tag === 'S_HARVESTED') tagPill = `<span class="pill SH">HARV</span>`;
  else if (f.probe) tagPill = `<span class="pill" style="background:#222;color:#666">${esc(f.probe)}</span>`;
  let extra = '';
  if (f.reason) extra += `<div class="reason">${esc(f.reason)}</div>`;
  if (f.question && (f.tag==='O_EXCLUSIVE' || f.tag==='S_REACHABLE')) {
    extra += `<div class="qa"><b>probe Q:</b> ${esc(f.question)}</div>`;
    // s_found = the search agent's self-report. The final tag (O_EXCLUSIVE
    // vs S_REACHABLE) is set by the judge comparing s_answer against
    // ground_truth, NOT by s_found alone. So "agent claimed answer" can
    // still be O_EXCLUSIVE if the judge found the answer mismatched.
    const claim = f.s_found ? 'agent claimed answer'
                            : 'agent gave up / no answer';
    const matched = f.tag === 'S_REACHABLE' ? ' · judge: MATCHES ground truth'
                  : f.tag === 'O_EXCLUSIVE' ? ' · judge: does NOT match ground truth'
                  : '';
    extra += `<div class="qa"><b>S agent (${claim}, ${f.s_steps||'?'} steps)${matched}:</b> ${esc(f.s_answer||'(empty)')}</div>`;
    // collapsible trace + harvested
    const tr = f.s_transcript || [];
    if (tr.length) {
      const steps = tr.map(t => {
        // v2 (production search-mode) uses tool/observation_head + extra
        // thinking fields; v1 used action/result_head. Read both.
        const tool = t.tool || t.action || '?';
        const head = (t.observation_head || t.result_head || '').slice(0, 800);
        const args = t.args ? esc(typeof t.args === 'string' ? t.args : JSON.stringify(t.args)) : '';
        const ad = t.action_description ? `<div class="tdesc"><b>do:</b> ${esc(t.action_description)}</div>` : '';
        const nar = t.next_action_rationale ? `<div class="trat"><b>why:</b> ${esc(t.next_action_rationale)}</div>` : '';
        const cum = t.cumulative_progress && t.cumulative_progress !== 'No progress yet.'
          ? `<div class="tcum"><b>progress so far:</b> ${esc(t.cumulative_progress)}</div>` : '';
        const url = t.current_url ? `<div class="turl">url: <code>${esc(t.current_url)}</code></div>` : '';
        return `<div class="tstep">
          <span class="tnum">step ${t.step}</span>
          <span class="taction ${tool}">${esc(tool)}</span>
          ${ad}
          ${nar}
          ${args ? `<div class="targs">args: ${args}</div>` : ''}
          ${url}
          <div class="tresult"><b>observation:</b> ${esc(head)}</div>
          ${cum}
        </div>`;
      }).join('');
      const harv = f.harvested || [];
      const harvBlock = harv.length ? `
        <div class="harvtable">harvested by this probe (${harv.length}):
          ${harv.map(h => `<div>· <span class="hh">${esc(h.key||'')}</span> = ${esc(h.value||'')} <i style="color:#566">(${esc(h.source||'')})</i></div>`).join('')}
        </div>` : '';
      extra += `<details><summary>S validation trace (${tr.length} tool call${tr.length>1?'s':''}${harv.length ? `, +${harv.length} harvested` : ''})</summary><div class="trace">${steps}</div>${harvBlock}</details>`;
    }
  }
  if (f.anchor) extra += `<div class="anchor">anchored to: <code>${esc(f.anchor)}</code> · source: ${esc(f.source||'')}</div>`;
  return `<tr class="${cls}">
    <td><div class="key">${esc(f.key||'')}</div></td>
    <td>${tagPill}</td>
    <td><div class="val">${esc(f.value||'')}</div>${extra}</td>
    <td>${f.step ?? ''}</td>
    <td>${isUsed?'<span class="pill task">in task</span>':''}</td>
  </tr>`;
}
function renderStepRow(s,i) {
  const n = (s.facts_learned||[]).length;
  const nupd = (s.facts_updated||[]).length;
  const npur = (s.facts_to_pursue||[]).length;
  const isE = s.role === 'extractor';
  const pillCls = isE ? 'E' : (s.mode==='ACT_OPS'?'O':'S');
  const pillLbl = isE ? 'E' : (s.mode==='ACT_OPS'?'O':(s.mode||'?'));
  const desc = esc(s.thought || s.action || '');
  return `<div class="step ${n>0?'has-fact':''} ${isE?'extractor':''} ${i===ST.stepIdx?'on':''}" data-i="${i}">
    <div class="num">#${s.step}${isE?'.E':''}</div>
    <span class="pill ${pillCls}">${pillLbl}</span>
    <span class="pill" style="background:#222;color:#bcd">${esc(s.tool||'-')}</span>
    <div class="desc">${desc}</div>
    ${n>0?`<span class="nfact">+${n}f</span>`:''}
    ${nupd>0?`<span class="nupd">~${nupd}u</span>`:''}
    ${npur>0?`<span class="npur">→${npur}q</span>`:''}
  </div>`;
}
function selectStep(i) {
  ST.stepIdx = i;
  const tl = document.querySelectorAll(".timeline .step");
  tl.forEach((el,j) => el.classList.toggle("on", j===i));
  const s = ST.data.steps[i];
  const isE = s.role === 'extractor';
  const fl = (s.facts_learned||[]).map(f=>`  - ${esc(f.key||'?')}: ${esc(f.value||'')}`).join('\n');
  const upd = (s.facts_updated||[]).map(u =>
    `  ~ ${esc(u.key||'?')} [${esc(u.reason||'')}]\n    → ${esc(u.value||'')}`
  ).join('\n');
  const pur = (s.facts_to_pursue||[]).map(q => `  ? ${esc(q)}`).join('\n');
  const pillCls = isE ? 'E' : (s.mode==='ACT_OPS'?'O':'S');
  const pillLbl = isE ? 'EXTRACTOR' : esc(s.mode||'?');
  const role = isE ? 'fact extractor' : 'operator';
  document.getElementById("detailHead").innerHTML = `Step #${s.step}${isE?' (extractor)':''} · <span class="pill ${pillCls}">${pillLbl}</span> · ${esc(s.tool||'-')} · <span style="color:#888">${role}</span>`;
  document.getElementById("detail").innerHTML = `
    ${s.shot?`<div class="sec"><div class="t">screenshot${isE?' (what the extractor saw)':''}</div><img src="${esc(s.shot)}" onclick="window.open(this.src)"></div>`:''}
    ${!isE && s.action?`<div class="sec"><div class="t">action</div><pre>${esc(s.action)}</pre></div>`:''}
    ${s.thought?`<div class="sec"><div class="t">${isE?'extractor note':'thought'}</div><pre>${esc(s.thought)}</pre></div>`:''}
    ${fl?`<div class="sec"><div class="t">facts_learned (+${(s.facts_learned||[]).length})</div><pre>${fl}</pre></div>`:''}
    ${upd?`<div class="sec"><div class="t">facts_updated (~${(s.facts_updated||[]).length}, applied ${s.updates_applied||0})</div><pre>${upd}</pre></div>`:''}
    ${pur?`<div class="sec"><div class="t">facts_to_pursue (→${(s.facts_to_pursue||[]).length})</div><pre>${pur}</pre></div>`:''}
    ${isE && s.extractor_raw?`<details class="sec"><summary>extractor raw output (truncated)</summary><pre>${esc(s.extractor_raw)}</pre></details>`:''}
    ${s.visual_note?`<div class="sec"><div class="t">visual_note</div><pre>${esc(s.visual_note)}</pre></div>`:''}
    ${s.obs_diagnostics?`<div class="sec"><div class="t">obs_status: ${esc(s.obs_status||'?')}</div><pre>${esc(s.obs_diagnostics)}</pre></div>`:''}
  `;
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
document.getElementById("q").oninput = e => { ST.q = e.target.value; renderList(); };
loadManifest();
</script>
</body>
